name: Deploy to GitHub Pages

# Le site est construit ici, pas commité. Le dépôt ne contient que du code ;
# `dist/` est produit à chaque push sur `main` et déployé tel quel.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui qui est en cours : couper
# un déploiement à mi-course laisse le site dans un état indéterminé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` et non `npm install` : la CI installe ce que le lockfile dit,
      # elle ne le renégocie pas.
      - run: npm ci

      # `prebuild` régénère le fond de carte et le logo, puis copie le CSV
      # dans public/. Il se déclenche tout seul avant `build`.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
